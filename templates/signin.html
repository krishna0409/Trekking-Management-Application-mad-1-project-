<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css' )}}">
    <title>Sign In</title>
</head>
<body>
    <div class="main-container2">
        <h1>Welcome to TrekWell</h1>
        <h4>Sign In and Start New Journey </h4>
        <form action="{{act}}" method="POST">
            <div class="input-group">
                <label><h5>Name</h5></label>
                <input type="text" name="name" required placeholder="Enter your Name">
            </div>
            <div class="input-group">
                <label><h5>Mobile no.</h5></label>
                <input type="tel" name="mob" required placeholder="Enter your Mobile no.">
            </div>
            <div class="input-group">
                <label><h5>Email Address</h5></label>
                <input type="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label><h5>Password</h5></label>
                <input type="password" name="pass" required placeholder="Enter your password">
             </div>
            <div>
                <label id="extra"><h5>Gender</h5></label>
                <input type="radio" name="choice" value="M" required>
                <label>Male</label>
                <input type="radio" name="choice" value="F" required>
                <label>Female</label>
                <input type="radio" name="choice" value="O" required>
                <label>Others</label>
            </div>
            <br>
            <button type="submit" class="Submit-btn">Sign In</button>
        </form>
        <div class="form-footer">
            <p>Already have an Account<a href="{{login}}"> Login in</a></p>
        </div>
    </div>
</body>
