<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Confirm</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css' )}}">
</head>
<body>
    <div class="main-container">
        <label id="extra"><h1>Are u Confirm to Register for this Trek</h1></label>
        <h5 style="margin-top: 20px;">Please Read Information About Trek</h5>
        <div class="main-container2">
        <div class="card" style="width: 18rem;">
            <img src="{{img}}" class="img-thumbnail" alt="...">
            <div class="card-body">
                <h4>{{i.name}}</h4>
                <p class="card-text">{{i.description}}</p>
                <p class="card-text">Difficulty : {{i.difficulty}}</p>
                <p class="card-text">Duration : {{i.duration}}</p>
            </div>
        </div>
        <br>
        <form action="{{act}}{{id}}/{{id2}}" method="POST">
            <div class="input-group">
                <label><h5>Booking Date</h5></label>
                <input type="date" name="date" required placeholder="Please Select Trekking Date" min={{tomm}} max={{maxx}}>
            </div>
            <div class="input-group">
                <label><h5>No. of slots to be booked:</h5></label>
                <input type="number" name="slots" required placeholder="Please Enter no. of slots">
            </div>
            <button type="submit" class="Submit-btn">Confirm to Register</button>
        </form>
    </div>
    </div>
</body>
</html>
