<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Trek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1>New Trek to Add</h1>
        <br>
        <form action="/add/trek" method="POST" id="add-trek">
            <div>
                <label>Trek ID :</label>
                <input type="text" name="code" required />
            </div>
            <br>
            <div>
                <label>Trek Name:</label>
                <input type="text" name="t_name" required />
            </div>
            <br>
            <div>
                <label>Trek Description: </label>
                <input type="text" name="desc" />
            </div>
            <br>
            <div>
                <label>Location : </label>
                <input type="text" name="desc" />
            </div>
            <br>
            <div>
                <label>Difficulty : </label>
                <input type="text" name="desc" />
            </div>
            <br>
            <div>
                <label>Duration :</label>
                <input type="text" name="desc" />
            </div>
            <br>
            <div>
                <label>Status :</label>
                <input type="text" name="desc" />
            </div>
            <br>
            <button type="submit" class="Submit-btn">Add new Trek</button>
        </form>
    </div>
</body>
</html>
