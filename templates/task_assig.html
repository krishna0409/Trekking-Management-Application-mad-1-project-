<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css' )}}">
    <title>Assigning Task</title>
</head>
<body>
    <div class="fixed-top">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="/profile/{{type}}/{{id}}/{{name}}/{{id}}">
                <img src="{{u_img}}" alt="Logo" width="30" height="30" class="d-inline-block align-text-top"> {{name}}
                </a>
                <ul class="nav justify-content-end">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/dashboard/{{type}}/{{id}}">Dashboard</a>
                </li>
                {% if 'user' in type %}
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/trek/register/{{id}}/{{name}}">Treks</a>
                    </li>
                {% elif 'staff' in type %}
                    <li class="nav-item">
                        <a href="/trek/details/{{type}}/{{id}}/{{name}}" class="nav-link active" aria-current="page">Opened Treks</a>
                    </li>
                {%else%}
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/trek/add/{{id}}/{{name}}">Add Trek</a>
                    </li>
                {%endif%}
                <li class="nav-item">
                    <a class="nav-link" href="/update/{{type}}/{{id}}/{{name}}">Update Account</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/delete/{{type}}/{{id}}/{{name}}">Delete Account</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
                </ul>
            </div>
        </nav>
    </div> 
    <div class="main-container2">
        <form action='/booking/assignment/task/{{type}}/{{id}}/{{name}}/{{dt}}' method="POST">
            <div class="input-group">
                <label><h5>Choose Date to Assign Task</h5></label>
                <input type="date" name="date" required placeholder="Please Select Date" min={{minn}} max={{maxx}}><br>
                <button type="submit" class="Submit-btn">Submit Date to Assign</button>
            </div>
        </form>
        <br><a href="/dashboard/{{type}}/{{id}}" class="btn btn-secondary">Click To Go Back to Dashboard</a>
    </div>
</body>
