<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css' )}}">
    <title>{{title}}</title>
</head>
<body>
    <div class="main-container">
        {% if 'Wrong' in title %}
            <h1>Wrong Credentials</h1>
            <h4>Please Retry !!!</h4>
            <div class="form-footer">
                <a href="{{url}}">GO BACK</a><br><br>
                <a href="/forget">To forget Password</a>
            </div>
        {% elif 'Welcome' in title %}
            <label id="extra"><h1>Welcome {{ mail }}</h1></label>
            <h4 style="margin-top: 20px;">Your TrekWell User ID is : {{ id }}</h4>
            <div class="form-footer">
                <a href="{{ url }}">Click to Login</a>
            </div>
        {% else %}
            <h1>User Not Found</h1>
            <div class="form-footer">
                <a href="{{url}}">Please Make an account First !! </a>
            </div>
        {% endif %}
    </div>
</body>
</html>
