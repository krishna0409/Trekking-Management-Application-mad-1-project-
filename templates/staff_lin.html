<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css' )}}">
</head>
<body>
    <div class="main-container">
        <h1>Welcome Back !! </h1>
        <h4>Log In and Back to Guiding</h4>
        <form action="/staff/login" method="POST">
            <div class="input-group">
                <label for="username"><h5>User_ID or Email</h5></label>
                <input type="text" id="username" name="user_id" placeholder="Enter your User_ID or Email" required>
            </div>
            <div class="input-group">
                <label for="password"><h5>Password</h5></label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="Submit-btn">Log In</button>
        </form>
        <div class="form-footer">
            <p><a href="/forget">Forgot Password?</a></p>
            <p>Don't have an account? <a href="/">Register here</a></p>
        </div>
    </div>
</body>
</html>
