<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css' )}}">
    <title>Slots Information</title>
</head>
<body>
    <div class="main-container1">
        <h1>Sorry for the Inconvenience</h1><hr>
        {% if slots>0 %}
            <h4>Remaining slots : {{slots}}</h4><hr>
            <a href="/trek/register/{{user}}" class="btn btn-info">Book Again</a>
        {% else %}
            <h4>On Your Chosen Date all Slots are Full</h4><hr>
            <h4>Please Try for some other Date</h4><hr>
            <a href="/dashboard/{{user}}" class="btn btn-secondary">Click To Back</a>
        {% endif %}
    </div>
</body>
</html>
