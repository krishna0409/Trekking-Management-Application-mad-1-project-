<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Trek</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css' )}}">
</head>
<body>
    <div class="main-container">
        <h1>Update Trek Information</h1>
        <br>
        <form action="/trek/update/{{id}}" method="POST" id="add-trek">
            <br>
            <div>
                <label>Trek Description: </label>
                <input type="text" name="desc" value="{{ list_used.description }}" />
            </div>
            <br>
            <div>
                <label>Difficulty : </label>
                <input type="text" name="diff" value="{{ list_used.difficulty }}" />
            </div>
            <br>
            <div>
                <label>Duration :</label>
                <input type="text" name="dur" value="{{ list_used.duration}}" />
            </div>
            <br>
            <div>
                <label>Status :</label>
                <input type="text" name="status" value="{{ list_used.current_status}}"/>
            </div>
            <br>
            <div>
                <label>Slots:</label>
                <input type="number" name="slots" value="{{ list_used.slots}}"/>
            </div>
            <br>
            <button type="submit" class="Submit-btn">Update Trek</button>
        </form>
    </div>
</body>
</html>
