<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancellation Confirmation</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css' )}}">
</head>
<body>
    <div class="main-container">
        <label id="extra"><h1>Are u Confirm to Cancel this Trek</h1></label>
        <div class="main-container2">
        <div class="card" style="width: 18rem;">
            <img src="{{img}}" class="img-thumbnail" alt="...">
            <div class="card-body">
                <h4>{{i.name}}</h4>
                <p class="card-text">{{i.description}}</p>
                <p class="card-text">Difficulty : {{i.difficulty}}</p>
                <p class="card-text">Duration : {{i.duration}}</p>
            </div>
        </div>
        <br>
        <form action="{{url}}{{id1}}/{{id2}}" method="POST">
            <button type="submit" class="Submit-btn">Confirm to Cancel</button>
        </form>
    </div>
    </div>
</body>
</html>
